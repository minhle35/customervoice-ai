[project]
name = "customer-voice-ai-backend"
version = "0.1.0"
description = "CustomerVoice AI – Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.30.6",
    # Pydantic & settings
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    # Database
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "pgvector==0.3.2",
    "alembic==1.13.3",
    # Async tasks
    "celery==5.4.0",
    "redis==5.1.1",
    # OpenAI (chat/LLM only — embeddings use sentence-transformers)
    "openai==1.51.0",
    # Embeddings — torch pinned to CPU-only build to keep image size small
    "torch",
    "sentence-transformers>=3.0.0",
    # HTTP client
    "httpx==0.27.2",
    # Ingestion + cleaning
    "praw>=7.7.1",
    "beautifulsoup4>=4.12",
    "langdetect>=1.0.9",
    # Utilities
    "python-dotenv>=1.1.0",
    "python-multipart==0.0.12",
    "langchain>=0.3.28",
    "langchain-openai>=0.2.2",
    "langchain-community>=0.3.27",
    "langgraph>=1.0.1",
    "deepeval>=2.6.7",
    "mlflow>=3.10.1",
    "langfuse>=4.0.1",
    "ragas>=0.2.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "httpx>=0.27.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# deepeval's pytest plugin imports google.genai (not installed) and crashes at collection
# The plugin is registered under the name "plugins" — disable it for regular test runs
addopts = "-p no:plugins"

[tool.coverage.run]
source = ["app", "pipelines"]
omit = ["*/tests/*", "*/migrations/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
