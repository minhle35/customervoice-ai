[project]
name = "customer-voice-ai-backend"
version = "0.1.0"
description = "CustomerVoice AI – Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    # Pydantic & settings
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    # Database
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "pgvector==0.3.2",
    "alembic==1.13.3",
    # Async tasks
    "celery==5.4.0",
    "redis==5.1.1",
    # OpenAI
    "openai==1.51.0",
    # HTTP client
    "httpx==0.27.2",
    # Ingestion + cleaning
    "praw>=7.7.1",
    "beautifulsoup4>=4.12",
    "langdetect>=1.0.9",
    # Utilities
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
